name: CD — GitHub Pages

on:
  # Só depois do CI na main (evita deploy duplicado com push + workflow_run)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gate:
    name: Gate (CI verde)
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI check
        run: echo "Gate OK — seguindo para deploy"

  deploy:
    name: Deploy GitHub Pages
    needs: gate
    runs-on: ubuntu-latest
    environment:
      # Mesmo environment que o GitHub Pages cria por padrão (evita 2 deployments)
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
