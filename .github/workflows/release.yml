name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a criar/publicar (ex.: v1.0.1) — só informativo no dispatch"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install & test before release
        run: |
          pip install -r requirements.txt
          ruff check .
          pytest --cov=calculadora --cov-fail-under=80

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Release automatizado pelo workflow `release.yml`.

            Pipeline validado: lint (Ruff) + testes com coverage ≥ 80%.
