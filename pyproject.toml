[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-actions-ci-cd-lab"
version = "1.0.0"
description = "Laboratório prático de CI/CD com GitHub Actions (Python + Pages)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Guilherme Roesler" }]
keywords = ["ci-cd", "github-actions", "devops", "learning"]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "ruff==0.16.5",
    "pip-audit==2.7.3",
]

[tool.setuptools]
py-modules = ["calculadora"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["calculadora"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
